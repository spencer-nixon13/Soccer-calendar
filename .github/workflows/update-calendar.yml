name: Update soccer calendar

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build calendar
        env:
          TEAM_ID: "494684"        # <- change this when you join a new team/season
          FACILITY_ID: "16"
          OUTPUT: "soccer.ics"
          GAME_MINUTES: "60"
          ALERT_MINUTES: "60"
        run: python make_calendar.py

      - name: Save changes
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add soccer.ics
          git diff --cached --quiet || git commit -m "Update soccer schedule"
          git push
